name: Test

# Every push and pull request: the publish workflow runs only when a release
# is published, so without this a change reaches main untested.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # jest (the original suite), the contract suite against stand-ins, and
      # the real SDKs against a local stub server -- no API keys needed.
      - run: npm test
